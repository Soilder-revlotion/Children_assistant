<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>育儿助手 - RAG 问答系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 20px; font-weight: 600; }
header .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.stats { display: flex; gap: 16px; font-size: 13px; }
.main { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
.welcome { text-align: center; padding: 60px 20px; color: #999; }
.welcome h2 { font-size: 28px; margin-bottom: 12px; color: #555; }
.welcome p { font-size: 14px; line-height: 1.8; }
.msg { margin-bottom: 20px; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: #667eea; color: white; border-radius: 18px 18px 4px 18px; max-width: 75%; padding: 12px 18px; font-size: 15px; line-height: 1.6; }
.msg.assistant .bubble { background: white; border-radius: 18px 18px 18px 4px; max-width: 85%; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-size: 15px; line-height: 1.8; }
.msg.assistant .sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; color: #888; }
.msg.assistant .sources .src { display: inline-block; margin: 2px 4px; padding: 2px 8px; background: #f0f0f0; border-radius: 8px; }
.msg.assistant .sources .src.tier1 { background: #e8f5e9; color: #2e7d32; }
.msg.assistant .sources .src.tier2 { background: #fff3e0; color: #ef6c00; }
.msg.assistant .sources .src.tier3 { background: #f5f5f5; color: #888; }
.typing { display: flex; gap: 6px; padding: 12px 20px; }
.typing span { width: 8px; height: 8px; background: #ccc; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
.disclaimer { background: #fff9c4; padding: 8px 16px; font-size: 11px; color: #8d6e00; text-align: center; }
footer { padding: 12px 20px; background: white; border-top: 1px solid #e0e0e0; }
.input-box { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
.input-box input { flex: 1; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 24px; font-size: 15px; outline: none; transition: border-color 0.2s; }
.input-box input:focus { border-color: #667eea; }
.input-box button { background: #667eea; color: white; border: none; padding: 14px 28px; border-radius: 24px; font-size: 15px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
.input-box button:hover { background: #5a6fd6; }
.input-box button:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>育儿助手</h1>
  <div class="stats">
    <span id="kbSize">知识库加载中...</span>
    <span class="badge" id="llmBadge">本地模型</span>
  </div>
</header>

<div class="main" id="chatContainer">
  <div class="welcome">
    <h2>育儿知识问答</h2>
    <p>基于 BGE 语义检索 + 本地大模型<br>覆盖新生儿护理、喂养、发育、疾病、疫苗等育儿主题<br>所有回答仅供参考，不能替代专业医生诊断</p>
  </div>
</div>

<footer>
  <div class="input-box">
    <input type="text" id="questionInput" placeholder="输入您的育儿问题，如：宝宝发烧怎么办？" autofocus>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</footer>

<div class="disclaimer">以上内容仅供参考，不能替代专业医生的诊断和建议。如宝宝有不适，请及时就医。</div>

<script>
const API = '/api/chat';

let loading = false;

async function init() {
  try {
    const r = await fetch('/api/knowledge/stats');
    const s = await r.json();
    document.getElementById('kbSize').textContent = `知识库: ${s.indexed_documents} 条`;
    document.getElementById('llmBadge').textContent = s.llm_provider;
  } catch(e) {}
}
init();

function addMessage(role, content, sources) {
  const container = document.getElementById('chatContainer');
  // Remove welcome
  const welcome = container.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = content.replace(/\n/g, '<br>');

  if (sources && sources.length > 0) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources';
    srcDiv.innerHTML = '<strong>参考来源：</strong> ';
    sources.forEach(s => {
      const tier = s.source_weight >= 0.8 ? 'tier1' : (s.source_weight >= 0.6 ? 'tier2' : 'tier3');
      const span = document.createElement('span');
      span.className = `src ${tier}`;
      span.textContent = `${s.source}: ${s.title.substring(0,30)}`;
      span.title = `相似度: ${s.similarity}, 来源权重: ${s.source_weight}`;
      srcDiv.appendChild(span);
    });
    bubble.appendChild(srcDiv);
  }

  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showTyping() {
  const container = document.getElementById('chatContainer');
  const welcome = container.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (loading) return;
  const input = document.getElementById('questionInput');
  const btn = document.getElementById('sendBtn');
  const question = input.value.trim();
  if (!question) return;

  loading = true;
  input.value = '';
  btn.disabled = true;

  addMessage('user', question);
  showTyping();

  try {
    const t0 = performance.now();
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, top_k: 5 }),
    });
    const data = await r.json();
    removeTyping();

    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    let text = data.answer;
    if (data.has_knowledge) {
      text += `\n\n<small style="color:#999;">检索耗时: ${data.latency_ms}ms | 总耗时: ${elapsed}s</small>`;
    }
    addMessage('assistant', text, data.sources);
  } catch(e) {
    removeTyping();
    addMessage('assistant', '抱歉，服务暂时不可用，请检查服务器是否运行。');
  }

  loading = false;
  btn.disabled = false;
  input.focus();
}

document.getElementById('questionInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
